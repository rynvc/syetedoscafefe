<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import Local Data - Syete Dos Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container py-4" style="max-width: 680px">
        <h1 class="h4">Import Local Cafe Data</h1>
        <p class="text-muted">Sign in as the owner, select the JSON backup exported from the old device, and import its menu and completed sales into the shared database. Re-importing the same backup won’t duplicate existing sales.</p>
        <a href="dashboard.html">Back to Dashboard</a>
        <section class="card p-3 mt-3">
            <label for="legacyBackup" class="form-label">Local data backup (.json)</label>
            <input id="legacyBackup" class="form-control" type="file" accept="application/json,.json">
            <button id="importLegacyData" class="btn btn-primary mt-3" type="button">Import backup</button>
            <p id="importStatus" class="small mt-3 mb-0" aria-live="polite"></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=local-fallback"></script>
    <script src="js/data.js?v=local-fallback"></script>
    <script src="js/app-shell.js?v=local-fallback"></script>
    <script src="js/data-migration.js"></script>
</body>
</html>
