<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Syete Dos Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=signin-photo">
</head>
<body class="login-body d-flex flex-column align-items-center justify-content-center vh-100">

    <!-- Store Header Branding -->
    <div class="text-center text-white mb-4">
        <h2 class="fw-bold mb-1">Syete Dos Cafe</h2>
        <p class="text-light opacity-75 small mb-0">Cafe Management System</p>
    </div>

    <!-- Login Card Container -->
    <div class="card p-4 shadow-lg border-0 login-card">
        <h4 class="fw-bold mb-4">Sign In</h4>
        
        <div id="errorMsg" class="alert alert-danger py-2 small" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    <button type="button" id="togglePassword" class="input-group-text bg-white text-muted" aria-label="Show password" aria-pressed="false">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Sign In</button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=local-fallback"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js?v=local-fallback"></script>
</body>
</html>
